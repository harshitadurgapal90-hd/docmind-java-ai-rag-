spring.application.name=dockmind

#
spring.datasource.url=jdbc:postgresql://localhost:5434/docmind
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate SQL Formatting
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# OpenAI Configuration
# ===============================
#spring.ai.openai.api-key=${OPENAI_API_KEY}


# Chat Model
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-4o-mini
#spring.ai.openai.chat.options.temperature=0.2
#spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.2

# Embedding Model
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
#spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768
# Vector Store
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.schema-name=public
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.multipart.max-file-size= 25MB
spring.multipart.max-request-size= 50MB

# RAG Configuration (Custom properties)
rag.chunking.chunk-size=600
rag.chunking.chunk-overlap=100
rag.retrieval.top-k=5
rag.retrieval.similarity-threshold=0.0

# CORS Configuration
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
